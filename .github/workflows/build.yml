# Fork CI. This repo is a push-mirror of the fork's self-hosted Gitea repository; GitHub
# only builds and publishes binaries. Upstream's workflows delegated to a
# private Prusa repo, so everything is spelled out here instead.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # brew/choco ship CMake 4, which refuses the cmake_minimum_required(<3.5)
  # in a few deps (libpng). Tell CMake to tolerate them.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      DEPS_DESTDIR: ${{ github.workspace }}/deps/build/destdir
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake ninja automake gettext libtool texinfo m4
          # Without an explicit sysroot Apple clang searches /usr/local/include (Homebrew) ahead of
          # -isystem paths, so e.g. Homebrew's png.h shadows the symbol-prefixed libpng from deps.
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Cache dependency bundle
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps/build/destdir
          key: deps-macos-${{ matrix.arch }}-${{ hashFiles('deps/CMakeLists.txt', 'deps/+*/**', 'deps/*.cmake', 'cmake/modules/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S deps -B deps/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DDESTDIR="$DEPS_DESTDIR"
          cmake --build deps/build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_PREFIX_PATH="$DEPS_DESTDIR/usr/local" \
            -DSLIC3R_STATIC=ON -DSLIC3R_BUILD_TESTS=OFF -DSLIC3R_PCH=ON \
            -DSLIC3R_BUILD_ID="PrusaSlicer-$(cat version.inc | sed -n 's/.*SLIC3R_VERSION "\(.*\)".*/\1/p')+git-sync.${{ github.run_number }}"

      - name: Build
        run: cmake --build build

      - name: Assemble .app bundle
        run: |
          APP=out/PrusaSlicer.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/src/PrusaSlicer "$APP/Contents/MacOS/PrusaSlicer"
          # (On macOS the OCCT/STEP wrapper is linked statically into the executable.)
          cp build/src/Info.plist "$APP/Contents/Info.plist"
          cp -R resources/ "$APP/Contents/Resources/"
          cp resources/icons/PrusaSlicer.icns "$APP/Contents/Resources/"
          echo -n "APPL????" > "$APP/Contents/PkgInfo"
          # Ad-hoc signature so Gatekeeper on the user's own machine accepts it after xattr -d com.apple.quarantine.
          codesign --force --deep --sign - "$APP"
          hdiutil create -volname PrusaSlicer -srcfolder out -ov -format UDZO "PrusaSlicer-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-macOS-${{ matrix.arch }}
          path: PrusaSlicer-macOS-${{ matrix.arch }}.dmg

  # -------------------------------------------------------------- Windows
  windows:
    runs-on: windows-2022
    env:
      DEPS_DESTDIR: ${{ github.workspace }}\deps\build\destdir
    steps:
      - uses: actions/checkout@v4

      - name: Set up the Visual Studio developer environment
        # find_library(Psapi) & co. need the Windows SDK LIB/INCLUDE dirs that vcvars exports.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache dependency bundle
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps\build\destdir
          key: deps-windows-x64-${{ hashFiles('deps/CMakeLists.txt', 'deps/+*/**', 'deps/*.cmake', 'cmake/modules/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cmake -S deps -B deps\build -G "Visual Studio 17 2022" -A x64 -DDESTDIR="%DEPS_DESTDIR%" || exit /b 1
          cmake --build deps\build --config Release -- /m || exit /b 1

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ^
            -DCMAKE_PREFIX_PATH="%DEPS_DESTDIR%\usr\local" ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\out\PrusaSlicer" ^
            -DSLIC3R_STATIC=ON -DSLIC3R_BUILD_TESTS=OFF -DSLIC3R_PCH=ON ^
            -DSLIC3R_BUILD_ID="PrusaSlicer+git-sync.${{ github.run_number }}" || exit /b 1

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --target ALL_BUILD -- /m || exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $out = "out\PrusaSlicer"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build\src\Release\*.exe $out
          Copy-Item build\src\Release\*.dll $out
          Copy-Item -Recurse resources "$out\resources"
          Compress-Archive -Path $out -DestinationPath PrusaSlicer-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-windows-x64
          path: PrusaSlicer-windows-x64.zip

  # ---------------------------------------------------------------- Linux
  linux:
    runs-on: ubuntu-22.04
    env:
      DEPS_DESTDIR: ${{ github.workspace }}/deps/build/destdir
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf build-essential cmake ninja-build git \
            libgtk-3-dev libglu1-mesa-dev libdbus-1-dev libwebkit2gtk-4.1-dev \
            libssl-dev libcurl4-openssl-dev m4 pkg-config texinfo gettext \
            libsecret-1-dev libfuse2 libhidapi-dev libudev-dev

      - name: Cache dependency bundle
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: deps/build/destdir
          key: deps-linux-x86_64-${{ hashFiles('deps/CMakeLists.txt', 'deps/+*/**', 'deps/*.cmake', 'cmake/modules/**') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S deps -B deps/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDEP_WX_GTK3=ON -DDESTDIR="$DEPS_DESTDIR"
          cmake --build deps/build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$DEPS_DESTDIR/usr/local" \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSLIC3R_STATIC=ON -DSLIC3R_GTK=3 -DSLIC3R_BUILD_TESTS=OFF -DSLIC3R_PCH=ON \
            -DSLIC3R_FHS=OFF -DSLIC3R_DESKTOP_INTEGRATION=OFF \
            -DSLIC3R_BUILD_ID="PrusaSlicer+git-sync.${{ github.run_number }}"

      - name: Build
        run: cmake --build build

      - name: Package AppImage
        run: |
          # Non-FHS layout: usr/bin/prusa-slicer finds its data in usr/resources (bin/../resources),
          # which keeps working wherever the AppImage is mounted.
          DESTDIR=$PWD/AppDir cmake --install build
          cp resources/icons/PrusaSlicer_192px.png AppDir/PrusaSlicer.png
          curl -sSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLo linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk
          ./linuxdeploy --appdir AppDir --plugin gtk \
            -e AppDir/usr/bin/prusa-slicer \
            -d AppDir/usr/resources/applications/PrusaSlicer.desktop \
            -i AppDir/PrusaSlicer.png \
            --output appimage
          mv PrusaSlicer*.AppImage PrusaSlicer-linux-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: PrusaSlicer-linux-x86_64
          path: PrusaSlicer-linux-x86_64.AppImage

  # -------------------------------------------------------------- Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
